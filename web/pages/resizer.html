<section class="max-w-4xl mb-8 mt-2">
    <h2 id="main-title" class="text-5xl font-headline font-black tracking-tight text-on-surface mb-2">Asset Resizer</h2>
    <p id="main-subtitle" class="text-on-surface-variant text-lg max-w-xl font-light">Reframe media intelligence globally via hardware accelerated scaling.</p>
</section>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2 group cursor-pointer" id="dropzone">
        <div class="h-[450px] border-2 border-dashed border-outline-variant dash-border-hover rounded-xl transition-all duration-500 flex flex-col items-center justify-center bg-surface-container-low/30 relative overflow-hidden">
            <div class="absolute -top-24 -left-24 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none group-hover:bg-primary/10 transition-colors duration-700"></div>
            <div class="relative z-10 text-center space-y-6 pointer-events-none">
                <div class="w-24 h-24 bg-surface-container-high rounded-full flex items-center justify-center mx-auto shadow-2xl group-hover:scale-110 transition-transform duration-500">
                    <span class="material-symbols-outlined text-primary text-4xl">aspect_ratio</span>
                </div>
                <div>
                    <h3 class="text-2xl font-headline font-bold text-on-surface">Drop assets to resize</h3>
                    <p class="text-on-surface-variant mt-2">or <span class="text-primary pointer-events-auto hover:underline" id="browse-btn">click to browse</span></p>
                </div>
            </div>
            <input type="file" id="file-input" multiple class="hidden" accept="image/*,video/*">
        </div>
    </div>
    
    <div class="lg:col-span-1">
        <div class="glass-panel h-full rounded-xl p-8 flex flex-col shadow-2xl">
            <div class="flex items-center gap-3 mb-8">
                <span class="material-symbols-outlined text-primary-fixed-dim">straighten</span>
                <h4 class="font-headline font-bold text-xl uppercase tracking-wider">Dimensions</h4>
            </div>
            <div class="space-y-8 flex-1">
                <div class="flex gap-4 items-end">
                    <div class="flex-1 space-y-3">
                        <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-[0.2em]">Width</label>
                        <input type="number" id="resize-w" placeholder="1920" class="w-full bg-surface-container-lowest border-none py-4 px-5 rounded-lg text-on-surface focus:ring-1 focus:ring-primary text-center font-mono">
                    </div>
                    <span class="text-on-surface-variant font-black mb-4 px-2">X</span>
                    <div class="flex-1 space-y-3">
                        <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-[0.2em]">Height</label>
                        <input type="number" id="resize-h" placeholder="1080" class="w-full bg-surface-container-lowest border-none py-4 px-5 rounded-lg text-on-surface focus:ring-1 focus:ring-primary text-center font-mono">
                    </div>
                </div>
                <div class="space-y-4">
                    <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-[0.2em]">Fast Presets</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button class="preset-btn py-2 bg-surface-container-high hover:bg-primary/20 text-on-surface text-xs font-bold rounded transiton-colors" data-factor="0.5">Scale x0.5 (Div/2)</button>
                        <button class="preset-btn py-2 bg-surface-container-high hover:bg-primary/20 text-on-surface text-xs font-bold rounded transiton-colors" data-factor="0.25">Scale x0.25 (Div/4)</button>
                        <button class="preset-btn py-2 bg-surface-container-high hover:bg-primary/20 text-on-surface text-xs font-bold rounded transiton-colors" data-factor="2.0">Scale x2.0 (Mul/2)</button>
                        <button class="preset-btn py-2 bg-surface-container-high hover:bg-primary/20 text-on-surface text-xs font-bold rounded transiton-colors" data-factor="4.0">Scale x4.0 (Mul/4)</button>
                    </div>
                </div>
            </div>
            <button id="btn-start" class="gold-gradient-btn w-full py-5 rounded-lg text-on-primary font-headline font-extrabold text-lg uppercase tracking-widest shadow-[0_10px_30px_rgba(242,202,80,0.15)] hover:shadow-[0_15px_40px_rgba(242,202,80,0.3)] hover:-translate-y-1 transition-all active:scale-95 duration-200 mt-8 group flex items-center justify-center gap-3">
                <span id="btn-text">RESIZE ASSET</span>
                <span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform" id="btn-icon">bolt</span>
            </button>
        </div>
    </div>
</div>
