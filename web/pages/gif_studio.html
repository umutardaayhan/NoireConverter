<section class="max-w-4xl mb-8 mt-2">
    <h2 id="main-title" class="text-5xl font-headline font-black tracking-tight text-on-surface mb-2">GIF Studio</h2>
    <p id="main-subtitle" class="text-on-surface-variant text-lg max-w-xl font-light">Craft cinematic loops with precise temporal and spatial control.</p>
</section>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2 group cursor-pointer" id="dropzone">
        <div class="h-[450px] border-2 border-dashed border-outline-variant dash-border-hover rounded-xl transition-all duration-500 flex flex-col items-center justify-center bg-surface-container-low/30 relative overflow-hidden">
            <div class="absolute -top-24 -left-24 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none group-hover:bg-primary/10 transition-colors duration-700"></div>
            <div class="relative z-10 text-center space-y-6 pointer-events-none">
                <div class="w-24 h-24 bg-surface-container-high rounded-full flex items-center justify-center mx-auto shadow-2xl group-hover:scale-110 transition-transform duration-500">
                    <span class="material-symbols-outlined text-primary text-4xl">gif_box</span>
                </div>
                <div>
                    <h3 class="text-2xl font-headline font-bold text-on-surface">Drop video to encode</h3>
                    <p class="text-on-surface-variant mt-2">or <span class="text-primary pointer-events-auto hover:underline" id="browse-btn">click to browse</span></p>
                </div>
            </div>
            <input type="file" id="file-input" multiple class="hidden" accept="video/*">
        </div>
    </div>
    
    <div class="lg:col-span-1 border-l border-outline-variant/10 pl-4 h-full">
        <div class="glass-panel h-[450px] rounded-xl p-6 flex flex-col shadow-2xl overflow-y-auto custom-scrollbar">
            <div class="flex items-center gap-3 mb-6">
                <span class="material-symbols-outlined text-primary-fixed-dim">movie_edit</span>
                <h4 class="font-headline font-bold text-xl uppercase tracking-wider">Parameters</h4>
            </div>
            <div class="space-y-6 flex-1">
                <div class="flex gap-4">
                    <div class="flex-1 space-y-2">
                        <label class="text-[9px] font-bold text-on-surface-variant uppercase tracking-[0.2em]">Start Time</label>
                        <input type="text" id="start-time" placeholder="00:00" class="w-full bg-surface-container-lowest border-none py-3 px-3 mx-1 rounded-lg text-on-surface focus:ring-1 focus:ring-primary text-center font-mono text-sm">
                    </div>
                    <div class="flex-1 space-y-2">
                        <label class="text-[9px] font-bold text-on-surface-variant uppercase tracking-[0.2em]">End Time</label>
                        <input type="text" id="end-time" placeholder="00:05" class="w-full bg-surface-container-lowest border-none py-3 px-3 mx-1 rounded-lg text-on-surface focus:ring-1 focus:ring-primary text-center font-mono text-sm">
                    </div>
                </div>
                <div class="space-y-3">
                    <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-[0.2em] flex justify-between">
                        Crop Area
                        <span class="text-primary cursor-pointer hover:underline">Auto-Center</span>
                    </label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" placeholder="X" class="bg-surface-container-lowest border-none py-2 px-3 rounded text-on-surface text-center font-mono text-xs">
                        <input type="number" placeholder="Y" class="bg-surface-container-lowest border-none py-2 px-3 rounded text-on-surface text-center font-mono text-xs">
                        <input type="number" placeholder="W" class="bg-surface-container-lowest border-none py-2 px-3 rounded text-on-surface text-center font-mono text-xs">
                        <input type="number" placeholder="H" class="bg-surface-container-lowest border-none py-2 px-3 rounded text-on-surface text-center font-mono text-xs">
                    </div>
                </div>
                <div class="space-y-3">
                    <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-[0.2em]">Framerate (FPS)</label>
                    <select class="w-full bg-surface-container-lowest border-none py-3 px-4 rounded-lg text-on-surface text-sm">
                        <option>10</option>
                        <option>15</option>
                        <option selected>24 (Cinematic)</option>
                        <option>30 (Smooth)</option>
                    </select>
                </div>
            </div>
            <button id="btn-start" class="gold-gradient-btn w-full py-4 rounded-lg text-on-primary font-headline font-extrabold text-sm uppercase tracking-widest hover:shadow-[0_15px_40px_rgba(242,202,80,0.3)] hover:-translate-y-1 transition-all mt-4 flex justify-center gap-2 items-center">
                RENDER GIF
            </button>
        </div>
    </div>
</div>
<style>
/* Minik kaydırma çubuğu makyajı için */
.custom-scrollbar::-webkit-scrollbar { width: 4px; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #4d4635; border-radius: 4px; }
</style>
